[project]
name = "methylgkb-strata"
version = "0.1.0"
description = "Methylation-marker discovery agent for drug-response subgroup hypotheses"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "lifelines>=0.30.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
